services:
  tuya-smartmeter:
    image: ghcr.io/pdreisbach/tuya-smartmeter:latest
    container_name: tuya-smartmeter
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - tuya-config:/config
    environment:
      TZ: Europe/Berlin
      # LOG_LEVEL: DEBUG   # bei Bedarf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  tuya-config:
