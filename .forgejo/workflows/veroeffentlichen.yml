# Baut das Abbild und veroeffentlicht es -- ausgeloest durch einen Tag.
#
#   git tag v1.9.5 && git push --tags     → 1.9.5 und latest
#   git tag v2.0.0-rc1 && git push --tags → nur 2.0.0-rc1, latest bleibt
#
# Ein Push auf main loest nichts aus (siehe pruefen.yml). So entscheidet
# allein das Setzen eines Tags, was bei anderen ankommt.
name: Veroeffentlichen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pruefen:
    # Eigener Auftrag im Playwright-Abbild: Python und Chromium sind dort
    # fertig eingerichtet.
    runs-on: docker
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      # Ohne node laeuft actions/checkout hier nicht -- git genuegt.
      - run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" .
      - run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir playwright==1.55.0
      - run: python tests/test_logic.py
      - run: python tests/test_ui.py
      - run: python tests/test_browser.py
      - run: python tests/test_doku.py

  bauen:
    needs: pruefen
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4


      - name: Version aus dem Tag ableiten
        id: v
        run: |
          NUMMER="${GITHUB_REF_NAME#v}"
          echo "nummer=$NUMMER" >> "$GITHUB_OUTPUT"
          echo "datum=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Eine Vorabversion traegt einen Bindestrich (1.0.0-rc1). Sie wird
          # veroeffentlicht, bekommt aber kein "latest" -- wer latest zieht,
          # bleibt damit auf dem letzten fertigen Stand.
          case "$NUMMER" in
            *-*) echo "vorab=ja"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "vorab=nein" >> "$GITHUB_OUTPUT" ;;
          esac
          # Reihen-Tags zum Festhalten: wer :1 eintraegt, bekommt Korrekturen,
          # aber keinen Sprung auf eine Version 2.
          echo "reihe=${NUMMER%%.*}" >> "$GITHUB_OUTPUT"
          echo "reihe_minor=$(echo "$NUMMER" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: An ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pascalmd
          password: ${{ secrets.GHCR_TOKEN }}

      - name: An der eigenen Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: git.7x10.net
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Einmal bauen, an beide Stellen schieben: gleiche Pruefsumme,
          # damit spaeter niemand raten muss, welches Abbild wo laeuft.
          tags: |
            ghcr.io/pascalmd/tuya-smartmeter:${{ steps.v.outputs.nummer }}
            git.7x10.net/pascal/tuya-smartmeter:${{ steps.v.outputs.nummer }}
            ${{ steps.v.outputs.vorab == 'nein' && format('ghcr.io/pascalmd/tuya-smartmeter:{0}', steps.v.outputs.reihe) || '' }}
            ${{ steps.v.outputs.vorab == 'nein' && format('ghcr.io/pascalmd/tuya-smartmeter:{0}', steps.v.outputs.reihe_minor) || '' }}
            ${{ steps.v.outputs.vorab == 'nein' && 'ghcr.io/pascalmd/tuya-smartmeter:latest' || '' }}
            ${{ steps.v.outputs.vorab == 'nein' && 'git.7x10.net/pascal/tuya-smartmeter:latest' || '' }}
          build-args: |
            APP_VERSION=${{ steps.v.outputs.nummer }}
            BUILD_DATE=${{ steps.v.outputs.datum }}
            GIT_COMMIT=${{ github.sha }}

      - name: Ergebnis
        run: |
          echo "Veroeffentlicht: ${{ steps.v.outputs.nummer }}"
          if [ "${{ steps.v.outputs.vorab }}" = "ja" ]; then
            echo "Vorabversion -- latest wurde NICHT verschoben."
          else
            echo "latest, :${{ steps.v.outputs.reihe }} und :${{ steps.v.outputs.reihe_minor }} zeigen jetzt hierher."
          fi
