# Prueft jeden Stand auf main -- ohne etwas zu veroeffentlichen.
name: Pruefen

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Paketquellen auf IPv4 festlegen
        # Die Docker-Bruecke dieses Rechners spricht kein IPv6, die
        # Paketquellen loesen aber auf IPv6-Adressen auf. apt laeuft dann in
        # Zeitueberschreitungen, ohne je einen Fehler zu melden -- der Auftrag
        # haengt einfach.
        run: echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99-ipv4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          playwright install --with-deps chromium
      - run: python tests/test_logic.py
      - run: python tests/test_ui.py
      - run: python tests/test_browser.py
      - run: python tests/test_doku.py
