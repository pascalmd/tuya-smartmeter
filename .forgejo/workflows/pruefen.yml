# Prueft jeden Stand auf main -- ohne etwas zu veroeffentlichen.
#
# Der Auftrag laeuft im fertigen Playwright-Abbild: Dort sind Python 3.12 und
# ein einsatzbereiter Chromium schon enthalten. Der Weg ueber
# "playwright install --with-deps" holte stattdessen bei jedem Lauf rund
# 200 MB Systempakete -- das dauerte laenger als alle Pruefungen zusammen.
name: Pruefen

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: docker
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: |
          pip install --no-cache-dir -r requirements.txt
          # Die Version muss zum Browser im Abbild passen, sonst sucht
          # Playwright einen, den es dort nicht gibt.
          pip install --no-cache-dir playwright==1.55.0

      - name: Schaltlogik und Geraetebestand
        run: python tests/test_logic.py

      - name: Oberflaeche in allen Zustaenden
        run: python tests/test_ui.py

      - name: Uebersicht im echten Browser
        run: python tests/test_browser.py

      - name: Anleitungen gegen den Code
        run: python tests/test_doku.py
