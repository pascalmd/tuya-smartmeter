{% extends "base.html" %}
{% block title %}{{ cfg.get('device_name') or 'Übersicht' }}{% endblock %}
{% block content %}

<div id="alerts"></div>

<div class="card">
  <h2>Strompreis</h2>
  <div id="price-now" style="font-size:30px; font-weight:700; line-height:1.2">–</div>
  <div id="price-meta" class="muted">wird geladen …</div>
</div>

<div class="card">
  <h2>Schalter</h2>
  <div id="switches" class="muted">wird geladen …</div>
  <div id="automation-note" class="muted" style="margin-top:12px"></div>
</div>

<div class="card">
  <h2>Messwerte</h2>
  <div id="metrics" class="muted">wird geladen …</div>
</div>

<div class="card" id="settings-card" style="display:none">
  <h2>Geräteeinstellungen</h2>
  <div id="device-settings" class="muted"></div>
</div>

<div class="card" id="upcoming-card" style="display:none">
  <h2>Nächste Stunden</h2>
  <div id="upcoming" style="display:flex; gap:4px; align-items:flex-end; overflow-x:auto; padding-bottom:4px"></div>
</div>

<div class="card">
  <h2>Status</h2>
  <div id="status" class="muted">–</div>
</div>

<style>
  .row {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .row:first-child { border-top:0; }
  .row .val { font-variant-numeric: tabular-nums; font-weight:600; }
  .pill { font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .bar { width:26px; border-radius:4px 4px 0 0; background:var(--accent); opacity:.35; }
  .bar.on { opacity:1; }
  .bar-wrap { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--muted); }
</style>

<script>
const fmt = (v) => (typeof v === 'number' ? v.toLocaleString('de-DE', {maximumFractionDigits: 2}) : v);

async function load() {
  let s;
  try {
    const resp = await fetch('/api/state', {credentials: 'same-origin'});
    if (resp.status === 401) { location.href = '/login'; return; }
    s = await resp.json();
  } catch (e) {
    document.getElementById('status').textContent = 'Keine Verbindung zum Server.';
    return;
  }

  // Meldungen
  const alerts = [];
  const t = s.trial || {};
  if (t.expired) {
    alerts.push(['err', `<strong>Der Testzeitraum deines Tuya-Projekts ist abgelaufen.</strong>
      Die App kann nicht mehr schalten, bis du ihn verlängerst:
      auf <a href="https://iot.tuya.com" target="_blank" rel="noopener"><code>iot.tuya.com</code></a> → dein Projekt → <em>Service</em> → <em>Extend Trial</em>.
      Das ist kostenlos und dauert eine Minute.
      <form method="post" action="/trial-verlaengert" style="margin-top:8px">
        <button style="padding:5px 12px; font-size:13px">Erledigt — Zähler zurücksetzen</button>
      </form>`]);
  } else if (t.warn && t.exact) {
    alerts.push(['warn', `<strong>Dein Tuya-Zugang endet in ${t.days_left} Tagen</strong> (am ${t.expires}).
      Verlängere jetzt: <a href="https://iot.tuya.com/cloud/" target="_blank" rel="noopener">iot.tuya.com</a>
      → dein Projekt → <em>Service</em> → <em>Extend Trial</em>.
      Das ist ein Antrag, den Tuya prüft — er kann einen Werktag dauern, also nicht bis zum letzten Tag warten.`]);
  } else if (t.warn) {
    alerts.push(['warn', `Dein Tuya-Projekt läuft seit ${t.days} Tagen.
      Kostenlose Projekte sind befristet — verlängere jetzt vorsorglich unter
      <a href="https://iot.tuya.com" target="_blank" rel="noopener"><code>iot.tuya.com</code></a> → Projekt → <em>Service</em> → <em>Extend Trial</em>,
      dann steht die App nicht plötzlich still.
      <form method="post" action="/trial-verlaengert" style="margin-top:8px">
        <button class="secondary" style="padding:5px 12px; font-size:13px">Erledigt — Zähler zurücksetzen</button>
      </form>`]);
  }
  if (s.online === false) {
    alerts.push(['err', `<strong>Das Gerät ist nicht erreichbar</strong>${s.offline_minutes ? ' (seit ' + s.offline_minutes + ' min)' : ''}.
      Die unten angezeigten Werte sind der letzte bekannte Stand und werden nicht mehr aufgezeichnet.
      Geschaltet wird ebenfalls nicht. Prüfe Stromversorgung und WLAN des Geräts.`]);
  }
  if (s.error) alerts.push(['err', 'Tuya: ' + s.error]);
  if (s.price && s.price.error) alerts.push(['err', 'Preisabruf: ' + s.price.error]);
  if (s.age_seconds !== null && s.age_seconds > Math.max(60, s.refresh_seconds * 6))
    alerts.push(['warn', 'Letzte Rückmeldung vor ' + Math.round(s.age_seconds) + ' s.']);
  document.getElementById('alerts').innerHTML = alerts
    .map(([k, t]) => `<div class="msg ${k}">${t}</div>`).join('');

  // Preis
  const p = s.price || {};
  document.getElementById('price-now').textContent = p.ct != null ? fmt(p.ct) + ' ct/kWh' : '–';
  const preisMeta = document.getElementById('price-meta');
  if (p.ct != null) {
    const teile = [];
    if (p.level_label) teile.push(p.level_label);
    if (p.is_spot && p.spot_ct != null) teile.push('Börse ' + fmt(p.spot_ct) + ' ct + Aufschlag');
    teile.push('Stand vor ' + Math.round(p.age_seconds || 0) + ' s');
    preisMeta.textContent = teile.join(' · ');
  } else {
    preisMeta.innerHTML = 'Noch keine Preise. <a href="/prices">Quelle wählen</a>';
  }

  // Schalter
  const auto = s.automation || {};
  const offline = s.online === false;
  document.getElementById('switches').innerHTML = (s.switches || []).length
    ? s.switches.map(sw => `
        <div class="row">
          <div>${sw.label}<div class="muted">${sw.code}</div></div>
          <div style="display:flex; gap:8px">
            <button ${sw.value ? 'class="secondary"' : ''} onclick="setSwitch('${sw.code}', true)"  ${sw.value || offline ? 'disabled' : ''}>Ein</button>
            <button ${!sw.value ? 'class="secondary"' : ''} onclick="setSwitch('${sw.code}', false)" ${!sw.value || offline ? 'disabled' : ''}>Aus</button>
          </div>
        </div>`).join('')
    : '<span class="muted">Dieses Gerät meldet keinen schaltbaren Ausgang.</span>';

  // Automatik-Hinweis
  const note = document.getElementById('automation-note');
  if (!auto.enabled) {
    note.innerHTML = 'Automatik ist aus. <a href="/automation">Einrichten</a>';
  } else if (auto.override_active) {
    note.innerHTML = `Handbetrieb — Automatik pausiert (noch ${auto.override_remaining_minutes} min).
      <form method="post" action="/automation/resume" style="display:inline">
        <button class="secondary" style="padding:4px 10px; font-size:13px">Jetzt fortsetzen</button>
      </form>`;
  } else {
    const d = auto.decision || {};
    note.innerHTML = `Automatik aktiv (${auto.mode_label})${d.reason ? ' — ' + d.reason : ''}`
      + (auto.last_action ? `<div class="muted">Zuletzt: ${auto.last_action}</div>` : '');
  }

  // Messwerte
  const rows = [];
  (s.metrics || []).forEach(m => {
    rows.push(`<div class="row"><div>${m.label}<div class="muted">${m.code}</div></div>
               <div class="val">${fmt(m.value)} ${m.unit || ''}</div></div>`);
  });
  (s.phases || []).forEach(ph => {
    rows.push(`<div class="row"><div>${ph.label}</div><div class="val">
      ${fmt(ph.voltage_v)} V · ${fmt(ph.current_a)} A · ${fmt(ph.power_w)} W</div></div>`);
  });
  document.getElementById('metrics').innerHTML =
    (offline && rows.length ? '<div class="muted" style="padding-bottom:8px">Letzter bekannter Stand — das Gerät meldet sich nicht.</div>' : '')
    + (rows.join('') || '<span class="muted">Keine Messwerte.</span>');

  // Einstellwerte des Geräts (z. B. Abschalt-Timer) getrennt zeigen
  const st = (s.settings || []);
  const stBox = document.getElementById('settings-card');
  if (st.length) {
    stBox.style.display = '';
    document.getElementById('device-settings').innerHTML = st.map(x =>
      `<div class="row"><div>${x.label}<div class="muted">${x.code}</div></div>
       <div class="val">${fmt(x.value)} ${x.unit || ''}</div></div>`).join('');
  } else {
    stBox.style.display = 'none';
  }

  // Preisbalken
  const up = (p.upcoming || []);
  if (up.length) {
    const max = Math.max(...up.map(u => u.ct || 0)) || 1;
    document.getElementById('upcoming-card').style.display = '';
    document.getElementById('upcoming').innerHTML = up.map(u => `
      <div class="bar-wrap" title="${u.day} ${u.hour} · ${fmt(u.ct)} ct/kWh · ${u.level_label}">
        <div>${fmt(u.ct)}</div>
        <div class="bar" style="height:${Math.max(8, (u.ct / max) * 90)}px"></div>
        <div>${u.hour}</div>
      </div>`).join('');
  }

  document.getElementById('status').innerHTML =
    `Gerät: ${s.device_name || '–'} (${s.online === false ? 'nicht erreichbar' : s.online ? 'verbunden' : 'unbekannt'}) · Abfragen: ${s.polls} (${s.failures} Fehler) ·
     Intervall: ${s.refresh_seconds} s · Dienst läuft seit ${Math.round(s.uptime_seconds / 60)} min`;
}

async function setSwitch(code, value) {
  document.querySelectorAll('#switches button').forEach(b => b.disabled = true);
  try {
    const resp = await fetch('/api/switch', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({code, value}),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({detail: 'Unbekannter Fehler'}));
      document.getElementById('alerts').innerHTML =
        `<div class="msg err">Schalten fehlgeschlagen: ${err.detail}</div>`;
    }
  } finally {
    await load();
  }
}

load();
setInterval(load, 5000);
</script>
{% endblock %}
