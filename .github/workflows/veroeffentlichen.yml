# Baut das Container-Abbild und veroeffentlicht es auf ghcr.io.
#
# Ausgeloest wird das durch einen Versions-Tag (v1.2.3). Der entsteht in
# Forgejo auf git.7x10.net; von dort spiegelt Forgejo den Stand samt Tags
# hierher, und dieser Ablauf uebernimmt den Rest. Niemand muss einen Build
# von Hand anstossen.
#
# Warum hier und nicht auf dem eigenen Server: Ein eigener Runner muesste
# dauerhaft laufen, gepflegt werden und ARM per Emulation bauen. Hier gibt es
# beide Architekturen als echte Maschinen, und der Zugang zur Registry ist der
# des Ablaufs selbst -- es braucht kein dauerhaft gueltiges Zugangstoken.
name: Veroeffentlichen

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # zur Not von Hand ausloesbar

env:
  ABBILD: ghcr.io/${{ github.repository }}

jobs:
  pruefen:
    name: Pruefungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Schaltlogik und Geraetebestand
        run: python tests/test_logic.py

      - name: Oberflaeche in allen Zustaenden
        run: python tests/test_ui.py

      - name: Uebersicht im echten Browser
        run: python tests/test_browser.py

      - name: Anleitungen gegen den Code
        run: python tests/test_doku.py

  bauen:
    name: Bauen und veroeffentlichen
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # genuegt fuer ghcr.io im eigenen Namensraum
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag
        id: version
        run: |
          echo "nummer=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "datum=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen fuer amd64 und arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ABBILD }}:${{ steps.version.outputs.nummer }}
            ${{ env.ABBILD }}:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.nummer }}
            BUILD_DATE=${{ steps.version.outputs.datum }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis nennen
        run: |
          echo "Veroeffentlicht: ${{ env.ABBILD }}:${{ steps.version.outputs.nummer }}"
          echo "Architekturen:"
          docker buildx imagetools inspect "${{ env.ABBILD }}:${{ steps.version.outputs.nummer }}" \
            | grep -E "Platform" | sort -u
